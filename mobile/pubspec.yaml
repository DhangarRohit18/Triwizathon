name: stockpilot_mobile
description: "STOCKPILOT AI Mobile - Enterprise Android Companion for Warehouse Operations & Distribution Intelligence"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & HTTP
  dio: ^5.8.0+1

  # Firebase Suite
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # QR & Barcode Scanning and Generation
  mobile_scanner: ^6.0.7
  qr_flutter: ^4.1.0

  # Charts & Visualization
  fl_chart: ^0.70.2

  # Persistence & Network Status
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.4

  # Utilities & Icons
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
