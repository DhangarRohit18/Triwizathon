<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockPilot AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #e2e8f0;
      font-size: 13px;
    }
    header {
      padding: 12px 16px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      color: #38bdf8;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }
    .container {
      padding: 12px 16px;
    }
    .search-box {
      margin-bottom: 12px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: #141c2e;
      border: 1px solid #27354f;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 12px;
      outline: none;
    }
    .search-box input:focus {
      border-color: #38bdf8;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
    }
    .stat-card .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .stat-card .value { font-size: 15px; font-weight: 700; color: #f8fafc; margin-top: 2px; }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .stock-list, .alert-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 12px;
      border: 1px solid #1e293b;
      border-radius: 6px;
      background: #0b1120;
    }
    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid #162033;
    }
    .stock-item:last-child { border-bottom: none; }
    .stock-sku { font-weight: 600; font-family: monospace; font-size: 11px; color: #38bdf8; }
    .stock-qty { font-weight: 700; }
    .stock-qty.low { color: #f87171; }
    .alert-item {
      padding: 6px 10px;
      border-bottom: 1px solid #162033;
      font-size: 11px;
      color: #fca5a5;
    }
    .action-btn {
      width: 100%;
      padding: 9px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <header>
    <div class="logo-badge">
      <div class="pulse-dot"></div>
      STOCKPILOT AI
    </div>
    <div id="userBadge" style="font-size: 11px; color: #94a3b8;">Central Hub</div>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="skuInput" placeholder="Quick SKU search (e.g. PRD-VAX-01)..." />
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="label">Assigned Hub</div>
        <div class="value" id="whName">Chicago Central</div>
      </div>
      <div class="stat-card">
        <div class="label">Active Alerts</div>
        <div class="value" id="alertCount" style="color: #fca5a5;">0 Active</div>
      </div>
    </div>

    <div class="card-title">
      <span>Warehouse Inventory</span>
      <span style="color: #38bdf8; cursor: pointer;" id="refreshBtn">↻ Refresh</span>
    </div>
    <div class="stock-list" id="stockList">
      <div style="padding: 12px; text-align: center; color: #64748b;">Loading stock records...</div>
    </div>

    <div class="card-title">Active Cold-Chain Alerts</div>
    <div class="alert-list" id="alertList">
      <div style="padding: 10px; text-align: center; color: #10b981; font-size: 11px;">✓ All storage temperatures nominal</div>
    </div>

    <button class="action-btn" id="openConsoleBtn">
      Open StockPilot Enterprise Console ↗
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
